[package]
name = "hearth-agent"
version = "0.1.0"
edition = "2021"
description = "Local-model Hearthstone agent: protocol and offline control loop"
license = "MIT"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
