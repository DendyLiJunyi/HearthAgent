[project]
name = "hearth-agent-laya-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "laya[serve]==0.4.15",
    "torch==2.7.1",
    "transformers==4.57.6",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
